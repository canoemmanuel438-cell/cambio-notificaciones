<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="description" content="Visor PET: trazabilidad y conciliación transaccional POS y ATM (demostración con datos dummy).">
<title>Visor PET · Trazabilidad y conciliación transaccional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EDF2F7;--surface:#FFFFFF;--ink:#132433;--muted:#536477;--faint:#8394A6;--line:#D4DEE8;--line2:#E6ECF2;--track:#E1E8EF;
  --acc:#1D5C8A;--acc-soft:#E0ECF6;--acc-ink:#123F63;--acc-2:#8FB9D6;--org:#EE8A23;
  --navy:#0F3A5F;--navy2:#1F5F8B;--c1:#143F66;--c2:#22A0B8;--c3:#F0922E;--c4:#98A3AE;
  --ok:#17693A;--ok-bg:#DCF3E3;--ok-solid:#22A04B;--bad:#A11D1D;--bad-bg:#FCE3E1;--bad-solid:#D2362D;
  --pend:#4B5866;--pend-bg:#E6ECF1;--warn:#8A4B06;--warn-bg:#FDEBD5;
  --side:#FFFFFF;--side-ink:#2A3D50;--side-active:#1F5F8B;--side-faint:#7F8FA0;--side-hover:#EEF3F8;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1620;--surface:#16212D;--ink:#E7EDF3;--muted:#9FB0C1;--faint:#74879A;--line:#26384A;--line2:#1E2D3C;--track:#223243;
  --acc:#5EA6D6;--acc-soft:#16324A;--acc-ink:#BFDDF2;--acc-2:#2C5877;--org:#F2A04B;
  --navy:#0B2A45;--navy2:#174A70;--c1:#6FA8DC;--c2:#3BB7CE;--c3:#F4A24A;--c4:#7C8894;
  --ok:#8FDCA8;--ok-bg:#12301E;--ok-solid:#35B462;--bad:#F6ADA6;--bad-bg:#3A1714;--bad-solid:#E0574A;
  --pend:#B9C6D3;--pend-bg:#233344;--warn:#F4C98F;--warn-bg:#3A2710;
  --side:#121C27;--side-ink:#C4D1DE;--side-active:#1F5F8B;--side-faint:#7F92A5;--side-hover:#1B2836;
}}
:root[data-theme="dark"]{
  --bg:#0E1620;--surface:#16212D;--ink:#E7EDF3;--muted:#9FB0C1;--faint:#74879A;--line:#26384A;--line2:#1E2D3C;--track:#223243;
  --acc:#5EA6D6;--acc-soft:#16324A;--acc-ink:#BFDDF2;--acc-2:#2C5877;--org:#F2A04B;
  --navy:#0B2A45;--navy2:#174A70;--c1:#6FA8DC;--c2:#3BB7CE;--c3:#F4A24A;--c4:#7C8894;
  --ok:#8FDCA8;--ok-bg:#12301E;--ok-solid:#35B462;--bad:#F6ADA6;--bad-bg:#3A1714;--bad-solid:#E0574A;
  --pend:#B9C6D3;--pend-bg:#233344;--warn:#F4C98F;--warn-bg:#3A2710;
  --side:#121C27;--side-ink:#C4D1DE;--side-active:#1F5F8B;--side-faint:#7F92A5;--side-hover:#1B2836;
}
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px));height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Roboto',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.topbar{position:sticky;top:0;z-index:6;height:60px;display:flex;align-items:center;gap:18px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.tb-brand{display:flex;align-items:center;gap:10px;min-width:0}
.tb-brand b{display:block;font-size:17px;font-weight:900;color:var(--acc-ink);letter-spacing:.01em;line-height:1.1}
.tb-brand small{display:block;font-size:11.5px;color:var(--muted)}
.tb-tabs{margin-left:auto;display:flex;height:100%}
.tb-tabs button{display:flex;align-items:center;gap:7px;padding:0 16px;border:0;border-bottom:3px solid transparent;background:none;cursor:pointer;color:var(--muted);font-size:14px}
.tb-tabs button:hover{color:var(--ink);background:var(--side-hover)}
.tb-tabs button[aria-current="page"],.tb-tabs button[aria-expanded="true"]{color:var(--acc-ink);background:var(--acc-soft);border-bottom-color:var(--acc)}
.tb-user{display:flex;align-items:center;gap:10px;padding-left:16px;border-left:1px solid var(--line)}
.tb-user b{display:block;font-size:13px;font-weight:500}.tb-user small{display:block;font-size:11px;color:var(--muted)}
.tb-user button{border:0;background:none;cursor:pointer;color:var(--muted);padding:6px;border-radius:6px;display:flex}.tb-user button:hover{background:var(--side-hover);color:var(--ink)}
.avatar{width:32px;height:32px;border-radius:16px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.shell{display:flex;min-height:calc(100% - 60px)}
.side{width:232px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;padding:18px 12px 90px;position:sticky;top:60px;height:calc(100dvh - 60px);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.logo{width:30px;height:30px;border-radius:7px;background:var(--navy2);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav h2{font-size:12px;font-weight:700;color:var(--side-faint);padding:0 12px 6px;letter-spacing:.02em}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border:0;border-radius:7px;background:transparent;color:var(--side-ink);font-size:14px;text-align:left;cursor:pointer;width:100%}
.nav button:hover{background:var(--side-hover)}
.nav button svg{flex-shrink:0}
.nav button .lbl{line-height:1.25}
.nav button[aria-current="page"]{background:var(--side-active);color:#fff;font-weight:500}
.nav .badge{margin-left:auto;font-size:11px;background:var(--bad-solid);color:#fff;border-radius:10px;padding:1px 7px}

.main{flex:1;min-width:0;padding:24px 28px 90px;display:flex;flex-direction:column;gap:18px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:linear-gradient(100deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;border-radius:10px;padding:18px 22px;box-shadow:0 2px 10px rgba(15,58,95,.18)}
.ph h1{font-size:22px;font-weight:700;letter-spacing:.005em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph .sub{color:rgba(255,255,255,.85);font-size:13.5px;margin-top:4px}
.ph .mono{color:#fff}
.ph-act{display:flex;gap:8px;flex-wrap:wrap}
.ph .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.4);color:#fff}
.ph .btn:hover{background:rgba(255,255,255,.2);border-color:#fff}
.ph .btn.pri{background:#fff;border-color:#fff;color:#0F3A5F}
.ph .btn:disabled{opacity:.5}
.fbar{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.fld select,.fld input{height:38px;padding:0 10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;font-size:13px;color:var(--ink);min-width:0}
.fld input.on,.fld select.on{border-color:var(--acc)}
.fresh{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;padding-bottom:10px}
.dot{width:8px;height:8px;border-radius:4px;background:var(--ok-solid);display:inline-block}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{height:38px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-ink)}

.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:500}
.btn.pri:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--acc);cursor:pointer;padding:0;font-size:13px;font-weight:500}
.link:hover{text-decoration:underline}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-h h2{font-size:15px;font-weight:700;color:var(--acc-ink)}
.card-h span{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 17px;display:flex;flex-direction:column;gap:4px;text-align:left}
button.kpi{cursor:pointer}
button.kpi:hover{border-color:var(--faint)}
button.kpi[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-0.01em;font-variant-numeric:tabular-nums}
.kpi .n{font-size:12px;color:var(--muted)}
.kpi .n.up{color:var(--ok)}.kpi .n.down{color:var(--bad)}
.g2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.g2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:16px}
.g21{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}

.tw{overflow-x:auto;margin:0 -4px}
table.t{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.t th{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:0 10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:11px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr.sel td{background:var(--acc-soft)}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--line2)}
table.t td.r,table.t th.r{text-align:right}
table.t td>.mono{white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:11px;font-size:12px;font-weight:500;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)}.c-bad{background:var(--bad-bg);color:var(--bad)}.c-pend{background:var(--pend-bg);color:var(--pend)}.c-warn{background:var(--warn-bg);color:var(--warn)}.c-acc{background:var(--acc-soft);color:var(--acc-ink)}
.sem{display:flex;align-items:center;gap:3px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:5px;font-size:11px;font-weight:500;white-space:nowrap}
.pill.v{background:var(--ok-bg);color:var(--ok)}.pill.r{background:var(--bad-bg);color:var(--bad)}.pill.g{background:var(--pend-bg);color:var(--pend)}.pill.n{border:1px dashed var(--line);color:var(--faint)}
.sem i{width:6px;height:1px;background:var(--faint);opacity:.6}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}

.hb{display:flex;flex-direction:column;gap:12px}
.hb-row{display:flex;flex-direction:column;gap:5px;border:0;background:none;padding:0;text-align:left;width:100%}
button.hb-row{cursor:pointer}
button.hb-row:hover .hb-t{text-decoration:underline}
.hb-top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.hb-top .num{color:var(--muted)}
.bar{height:8px;background:var(--track);border-radius:4px;display:flex;overflow:hidden}
.bar>div{height:100%}
.sbars{display:flex;gap:3px;height:190px}
.sbar{flex:1;display:flex;flex-direction:column;min-width:0;gap:6px}
.sb-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:1px}
.sb-col div{border-radius:2px}
.sb-l{font-size:10px;color:var(--muted);height:13px;white-space:nowrap;overflow:visible}
.funnel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.fn{display:flex;flex-direction:column;gap:8px}
.fn-bar{height:110px;display:flex;align-items:flex-end;background:var(--bg);border-radius:6px}
.fn-bar div{width:100%;background:var(--acc);border-radius:6px}
.fn b{font-size:13px;font-weight:500}
.fn .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.fn small{font-size:12px;color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mini div{display:flex;flex-direction:column;gap:2px}
.mini .l{font-size:12px;color:var(--muted)}
.mini .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.note{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:6px;font-size:13px}
.note svg{flex-shrink:0;margin-top:2px}
.note.warn{background:var(--warn-bg);color:var(--warn)}.note.bad{background:var(--bad-bg);color:var(--bad)}.note.info{background:var(--acc-soft);color:var(--acc-ink)}

.sform{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.sform .acts{display:flex;align-items:flex-end;gap:8px}
.sform .acts .btn.pri{flex:1;justify-content:center}
.examples{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.examples button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer}
.examples button:hover{border-color:var(--acc);color:var(--acc-ink)}
.err{color:var(--bad);font-size:13px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pager div{display:flex;gap:8px}
.empty{padding:36px 12px;text-align:center;color:var(--muted);font-size:14px}

.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:28px}
.kv div{display:flex;flex-direction:column;gap:4px;padding:13px 0;border-bottom:1px solid var(--line2);min-width:0}
.kv span{font-size:12px;color:var(--muted)}
.kv b{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.stage-ic{width:22px;height:22px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--acc);cursor:pointer;font-size:13px;padding:0;width:max-content}
.rec{flex:1;border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:240px}
.rec.dup{border-color:var(--bad-solid)}
.rec h3{font-size:13px;font-weight:600;margin-bottom:6px}
.rec div{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line2)}
.rec div span:first-child{color:var(--muted)}
.tabs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content;max-width:100%}
.tabs button{height:40px;padding:0 18px;border:0;background:var(--surface);cursor:pointer;font-size:13px;white-space:nowrap}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.login{min-height:100%;display:flex}
.login-l{width:44%;max-width:600px;background:linear-gradient(160deg,#0F3A5F,#1F5F8B);padding:56px;display:flex;flex-direction:column;justify-content:space-between;gap:40px;color:#B7BBC4}
.login-l h1{color:#fff;font-size:38px;font-weight:600;line-height:1.15;letter-spacing:-0.02em;max-width:14ch}
.login-l p{font-size:15px;line-height:1.6;max-width:44ch;margin-top:16px}
.login-r{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px}
.login-box{width:100%;max-width:440px;display:flex;flex-direction:column;gap:20px}
.login-box h2{font-size:24px;font-weight:600}
.roles{display:flex;flex-direction:column;gap:8px}
.role{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left}
.role input{margin-top:3px;accent-color:var(--acc)}
.role b{display:block;font-size:14px;font-weight:500}
.role small{font-size:12px;color:var(--muted)}
.role:has(input:checked){border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}

.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.crumbs span[aria-current]{color:var(--ink);font-weight:500}
.crumbs svg{color:var(--faint)}
.kd-h{font-size:11.5px;color:var(--acc);display:inline-flex;align-items:center;gap:4px;margin-top:2px;opacity:.8}
button.kd:hover .kd-h{opacity:1;text-decoration:underline}
button.fn-bar{border:0;padding:0;cursor:pointer;width:100%}
button.fn-bar:hover{box-shadow:inset 0 0 0 2px var(--acc-2)}
.daybtns{position:absolute;inset:0;display:flex}
.daybtns button{flex:1;border:0;background:transparent;cursor:pointer;padding:0;border-radius:3px}
.daybtns button:hover{background:var(--acc-soft);opacity:.7}
.xbtn{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:5px;display:inline-flex}
.xbtn svg{transition:transform .15s}
.xbtn[aria-expanded="true"] svg{transform:rotate(90deg)}
.xbtn:hover{background:var(--line2);color:var(--ink)}
table.t tr.open td{border-bottom-color:transparent;background:var(--bg)}
table.t tr.xrow td{background:var(--bg);padding-top:4px;padding-bottom:16px}
.xd{display:flex;flex-direction:column;gap:12px}
.xkv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 24px}
.xkv div{display:flex;flex-direction:column;gap:2px;min-width:0}
.xkv span{font-size:11.5px;color:var(--muted)}
.xkv b{font-weight:500;font-size:13px;overflow-wrap:anywhere}
.etg{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-top:6px}
.et{border-radius:6px;padding:8px 9px;display:flex;flex-direction:column;gap:3px;min-width:0;border:1px solid transparent}
.et.v{background:var(--ok-bg);color:var(--ok)}.et.r{background:var(--bad-bg);color:var(--bad)}.et.g{background:var(--pend-bg);color:var(--pend)}.et.n{border:1px dashed var(--line);color:var(--faint)}
.et-h{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600}
.et-d{font-size:11.5px;overflow-wrap:anywhere}
.dyn{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;padding-bottom:14px;border-bottom:1px solid var(--line2)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;align-self:end;height:38px;cursor:pointer}
.chk input{accent-color:var(--acc);width:16px;height:16px}
.fld textarea{padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;color:var(--ink);resize:vertical}
.fiids{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.etl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.etl-r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px}
label.etl-r{cursor:pointer}

/* ---------- ficha técnica ---------- */
function vFicha(){
  const t=BYID[S.ficha];if(!t)return'<div class="empty">Transacción no encontrada.</div>';
  const rej=t.status==='Rechazada',nm=t.status==='No match';
  const rows=fichaRows(t).map(r=>{const icn=SEMI[r.st][0];return tr([`<span style="display:flex;align-items:center;gap:8px;font-weight:500"><span class="stage-ic pill ${r.st}" style="padding:0">${ic(icn,13)}</span>${r.proc}</span>`,esc(r.fuente),r.archivo==='—'?'—':mono(r.archivo),r.fecha,{h:r.monto==null?'—':money(r.monto),r:1},chip(r.estatus==='No aplica'?'Pendiente':r.estatus).replace('>Pendiente<','>No aplica<')]);});
  let notes='';
  if(t.montoComp)notes+=`<div class="note bad">${ic('alert',15)}<span>El importe de compensación (${money(t.montoComp)}) no coincide con el autorizado (${money(t.monto)}).</span></div>`;
  if(t.dupOf)notes+=`<div class="note bad">${ic('alert',15)}<span>Registro duplicado de <button class="link" data-act="ficha" data-v="${t.dupOf}">${t.dupOf}</button>. Llave de correlación PET ${mono(t.pet)}. Se retuvo en compensación para evitar un cargo doble.</span></div>`;
  if(t.dupHas)notes+=`<div class="note warn">${ic('alert',15)}<span>Este registro original tiene un duplicado: <button class="link" data-act="ficha" data-v="${t.dupHas}">${t.dupHas}</button>. Llave PET ${mono(t.pet)}.</span></div>`;
  if(t.notComp&&t.st.comp==='g')notes+=`<div class="note info">${ic('info',15)}<span>Autorizada y aún sin compensar. Quedan ${t.left} días del plazo de presentación (${t.tipo.toLowerCase()}, ${t.lim} días).</span></div>`;
  const plazo=rej?'Transacción rechazada en autorización':t.status==='Match'?'Ciclo conciliado':(t.left>=0?`${t.tipo} · quedan ${t.left} días del plazo de presentación (${t.lim} días)`:`${t.tipo} · plazo de presentación vencido`);
  const fromLbl={drill:'Volver a operaciones',nomatch:'Volver al reporte No Match',alertas:'Volver a alertas',traz:'Volver a la búsqueda',match:'Volver a match'}[S.fichaFrom]||'Regresar';
  const kv=(arr,cls='')=>`<div class="kv ${cls}">${arr.map(r=>`<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>`;
  const archivo=t.src.aut[1]!=='—'?t.src.aut[1]:t.canal==='POS'?'005'+ymd(t.fecha).slice(2)+'_101.PROC':t.src.comp[1];
  const gen=kv([['Archivo',mono(archivo)],['Fuente',t.canal==='POS'?'Transacciones POS PROSA · '+(t.origen==='Archivo'?'Archivo TEF':t.origen):'TLF · Transacciones ATM'],['Fecha de consumo',fDT(t.fecha)],['Fecha de proceso',fDate(addD(t.fecha,1))],['Procedencia',t.proc],['Nacional',t.nac],['Indicador DC','DC='+t.dc],['Draft capture',t.origen==='Online'?'Online (1)':'Batch (0)']],'kv2');
  const ent=kv([['Banco adquirente',esc(t.adq.name)],['ID adquirente',mono(t.adq.id)],['Red lógica adquirente',mono(t.redA)],['Banco emisor',esc(t.emi.name)],['ID emisor',mono(t.emi.id)],['Red lógica emisor',mono(t.redE)]],'kv2');
  const det=kv([['No. de referencia',mono(t.ref)],['No. de autorización',t.aut?mono(t.aut):'Sin autorización'],['Importe de la transacción',`<span class="big">${money(t.monto)}</span>`],['Tipo de transacción',t.tipoTrx],['Terminal',mono(t.term)],['Modo POS',mono(t.modo)],['No. de cuenta',maskCta(t.cuenta)],['Tarjeta',maskPan(t.pan)],['Débito / crédito',t.tipo],['Código de moneda','484 · MXN'],['Código ISO / Typ','001 / 0210'],['Afiliación',t.afil],['Folio',t.folio?mono(t.folio):'Sin folio'],['Token',mono(t.token)]],'kv3');
  let box;
  if(rej)box=`<div class="stbox bad"><h2>${ic('alert',18)}Estado y motivo del rechazo</h2><div class="bigi">${ic('alert',40)}</div><span style="font-size:12px;text-align:center">Motivo del rechazo</span><div class="mot">${t.motivo[0]} · ${esc(t.motivo[1].toUpperCase())}</div><dl><dt>Respuesta</dt><dd>${t.motivo[0]}</dd><dt>Tipo</dt><dd>${motTipo(t.motivo)}</dd><dt>IVA / % IVA</dt><dd>0 / .16</dd></dl></div>`;
  else if(nm)box=`<div class="stbox warn"><h2>${ic('alert',18)}Estado y motivo de no match</h2><div class="bigi">${ic('help',40)}</div><span style="font-size:12px;text-align:center">Motivo de no match</span><div class="mot">${esc(nmMotivo(t).toUpperCase())}</div><dl><dt>Etapa</dt><dd>${esc((ALERTS.find(a=>a.txId===t.id)||{}).etapa||'Compensación')}</dd><dt>Respuesta</dt><dd>${t.noAuth?'Sin respuesta online':'00 · Aprobada'}</dd><dt>Plazo</dt><dd>${t.left>=0?'Quedan '+t.left+' días':'Vencido'}</dd></dl></div>`;
  else box=`<div class="stbox ${t.status==='Match'?'ok':'pend'}"><h2>${ic(t.status==='Match'?'check':'clock',18)}Estado de la transacción</h2><div class="bigi">${ic(t.status==='Match'?'check':'clock',40)}</div><div class="mot">${t.status==='Match'?'CICLO CONCILIADO':'EN PROCESO'}</div><dl><dt>Respuesta</dt><dd>00 · Aprobada</dd><dt>Pasos</dt><dd>${MSTEPS.filter(s=>t.st[s[0]]==='v').length} de 4</dd><dt>Plazo</dt><dd>${t.status==='Match'?'Conciliada':(t.left>=0?'Quedan '+t.left+' días':'Vencido')}</dd></dl></div>`;
  const top=S.fichaFrom==='drill'&&S.drill?crumbs([[FROMLBL[S.drill.from],'nav',S.drill.from],[S.drill.t,'backDrill'],[t.id]]):`<button class="back" data-act="back">${ic('back',14)}${fromLbl}</button>`;
  return top+header(`Ficha técnica de transacción${rej?' rechazada':nm?' sin match':''} ${chip(t.status)}`,`<span class="mono">${t.id}</span> · consultada el ${fDT(TODAY)}`,expBtn('fichaXlsx','Excel')+expBtn('fichaPdf','Descargar PDF',true)+`<button class="btn" data-act="print">${ic('print',15)}Imprimir</button><button class="btn" data-act="back">Regresar</button>`)+
   `<div class="ft">${card(ic('doc',16)+'Datos generales de la transacción',gen)}${card(ic('search',16)+'Identificación de entidades',ent)}</div>`+
   `<div class="ft2">${card(ic('pos',16)+'Detalles de la operación',det)}${box}</div>`+
   card('Semáforo de match',`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${MSTEPS.map(s=>light(t.st[s[0]],s[1])).join('')}<span class="muted" style="font-size:13px;margin-left:6px">${plazo}</span></div>`)+
   card('Consulta de etapas',etapasGrid(t),'Online, compensación, DFC, folio, liquidación, aclaración, intercambio y match')+
   card('Cruce de trazabilidad por proceso',table(['Proceso','Fuente','Nombre de archivo','Fecha',{l:'Monto',r:1},'Estatus'],rows,{min:760})+notes,'Autorización, compensación, liquidación e intercambio');
}

function render(keepScroll){
  const app=document.getElementById('app');

function stLabel(t,k){const s=t.st[k];if(k==='aut'&&t.noAuth)return'No match';if(k==='aut'&&s==='r')return'Rechazada';return s==='v'?'Match':s==='r'?'No match':s==='g'?'En proceso':'No aplica';}
function fichaRows(t){
  return STAGES.slice(0,4).map(s=>{const k=s[0];const st=t.st[k];const src=t.src[k];
    const fecha=st==='v'||st==='r'?(k==='aut'?(t.noAuth?'—':fDT(t.fecha)):fDate(addD(t.fecha,k==='comp'?1:k==='liq'?(t.canal==='ATM'?1:1):2))):'—';
    const monto=st==='v'||st==='r'?(k==='comp'&&t.montoComp?t.montoComp:(k==='aut'&&t.noAuth?null:t.monto)):null;
    return{proc:s[1],fuente:src[0],archivo:src[1],fecha,monto,estatus:stLabel(t,k),st};});
}
function alertFiltered(){
  const a=S.al;return ALERTS.filter(x=>(!a.grupo||x.grupo===a.grupo)&&(!a.etapa||x.etapa===a.etapa)&&(!a.sev||x.sev===a.sev)&&(a.estado==='todas'||(a.estado==='activas'?x.estado!=='Cerrada':x.estado===a.estado)));
}
function vAlertas(){
  const a=S.al;const act=ROLES[S.role].act;
  const openBy={};ALERTS.filter(x=>x.estado!=='Cerrada').forEach(x=>openBy[x.grupo]=(openBy[x.grupo]||0)+1);
  const cards=`<div class="kpis" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">${GRUPOS.map(g=>`<button class="kpi" data-act="grupo" data-v="${esc(g)}" aria-pressed="${a.grupo===g}"><span class="l">${g}</span><span class="v">${openBy[g]||0}</span><span class="n">abiertas o en atención</span></button>`).join('')}</div>`;
  const etapas=[...new Set(ALERTS.map(x=>x.etapa))];
  const sel=(k,l,opts)=>`<label class="fld">${l}<select data-al="${k}" class="${a[k]&&a[k]!=='activas'?'on':''}">${opts.map(o=>`<option value="${esc(o[0])}" ${a[k]===o[0]?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`;
  const fb=`<div class="fbar">${sel('grupo','Tipo',[['','Todos']].concat(GRUPOS.map(g=>[g,g])))}${sel('etapa','Etapa',[['','Todas']].concat(etapas.map(e=>[e,e])))}${sel('sev','Severidad',[['','Todas'],['Alta','Alta'],['Media','Media'],['Baja','Baja']])}${sel('estado','Estado',[['activas','Abiertas y en atención'],['Abierta','Abiertas'],['En atención','En atención'],['Cerrada','Cerradas'],['todas','Todas']])}</div>`;
  const list=alertFiltered();const PS=15,pages=Math.max(1,Math.ceil(list.length/PS)),pg=Math.min(a.page,pages-1);

  const rows=list.slice(pg*PS,pg*PS+PS).map(x=>tr([x.txId==='—'?'—':mono(x.txId),esc(x.tipo),{h:aff(x),r:1},esc(x.etapa),fDT(x.dt),x.fuente.indexOf('.')>0&&x.fuente.indexOf(' ')<0?mono(x.fuente):esc(x.fuente),chip(x.sev),chip(x.estado),`<button class="link" data-act="alsel" data-v="${x.id}">Ver detalle</button>`],`class="${a.sel===x.id?'sel':''}"`));
  const tbl=table(['Transacción de referencia','Tipo de inconsistencia',{l:'Operaciones afectadas',r:1},'Etapa','Fecha / hora','Fuente','Severidad','Estado',''],rows,{min:1160,empty:'No hay alertas con estos filtros.'})+(list.length>PS?`<div class="pager"><span>${n0(list.length)} alertas</span><div><button class="btn" data-act="alpage" data-v="${pg-1}" ${pg===0?'disabled':''}>Anterior</button><span style="align-self:center">${pg+1} de ${pages}</span><button class="btn" data-act="alpage" data-v="${pg+1}" ${pg>=pages-1?'disabled':''}>Siguiente</button></div></div>`:`<div class="pager"><span>${n0(list.length)} alertas</span></div>`);
  let det='';const x=ALERTS.find(y=>y.id===a.sel);
  if(x){
    const t=x.txId!=='—'?BYID[x.txId]:null;
    let body=`<div class="kv">${[['Alerta',mono(x.id)],['ID de transacción',x.txId==='—'?'No aplica':mono(x.txId)],['Tipo de inconsistencia',esc(x.tipo)],['Etapa donde se detectó',esc(x.etapa)],['Fecha / hora',fDT(x.dt)],['Fuente involucrada',esc(x.fuente)],['Severidad',chip(x.sev)],['Estado',chip(x.estado)]].map(r=>`<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>`;
    if(t&&t.dupOf){const o=BYID[t.dupOf];const rec=(title,r,cls)=>`<div class="rec ${cls}"><h3>${title}</h3>${[['ID único',mono(r.id)],['Archivo',mono(r.src.aut[1])+' · línea '+n0(r.line)],['Recibido',fDT(r.recv)],['PAN',maskPan(r.pan)],['Monto',money(r.monto)],['Afiliación',r.afil],['Autorización',mono(r.aut)]].map(z=>`<div><span>${z[0]}</span><span>${z[1]}</span></div>`).join('')}</div>`;
      body+=`<div style="display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap"><span class="muted">Llave de correlación PET</span>${mono(t.pet)}</div><div style="display:flex;gap:14px;flex-wrap:wrap">${rec('Registro original',o,'')}${rec('Registro duplicado',t,'dup')}</div>`;}
    else if(t)body+=`<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">${sem(t)}<button class="link" data-act="ficha" data-v="${t.id}">Abrir ficha de la transacción</button></div>`;
    const btns=act?(x.estado==='Abierta'?`<button class="btn pri" data-act="alset" data-v="En atención">Tomar en seguimiento</button><button class="btn" data-act="alset" data-v="Cerrada">Cerrar alerta</button>`:x.estado==='En atención'?`<button class="btn pri" data-act="alset" data-v="Cerrada">Cerrar alerta</button><button class="btn" data-act="alset" data-v="Abierta">Regresar a abierta</button>`:`<button class="btn" data-act="alset" data-v="Abierta">Reabrir alerta</button>`):`<span class="muted" style="font-size:13px">Tu rol puede consultar esta alerta, pero no cambiar su estado.</span>`;
    body+=`<div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap">${btns}</div>`;
    det=`<div id="aldet">${card('Detalle de la alerta',body,x.grupo)}</div>`;

}

    case'smtab':S.sm.tab=v;S.sm.open=null;render(true);break;
    case'smopen':S.sm.open=S.sm.open===v?null:v;render(true);break;
    case'lysel':S.ly.sel=S.ly.sel===v?null:v;S.ly.confirm=false;S.ly.err='';S.ly.tab='def';if(S.ly.sel)log('Consulta de layout',v);render(true);{const d=document.getElementById('lydet');if(d)d.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});}break;
    case'lytab':S.ly.tab=v;render(true);break;
    case'lynew':if(ROLES[S.role].lay){S.ly.edit=true;S.ly.draft=lyNew();S.ly.err='';render();}break;
    case'lyedit':if(ROLES[S.role].lay){S.ly.edit=true;S.ly.draft=lyDraft(LAYOUTS.find(x=>x.id===v));S.ly.err='';S.ly.confirm=false;render();}break;
    case'lycancel':S.ly.edit=false;S.ly.draft=null;S.ly.err='';render();break;
    case'lysave':if(lySave())render();else{render(true);const e2=document.querySelector('.err');if(e2)e2.scrollIntoView({block:'center'});}break;
    case'lyadd':{const c=S.ly.draft.campos;const l=c[c.length-1];c.push({n:'',pos:l?l.pos+l.lon:1,lon:1,tipo:'Alfanumérico'});render(true);break;}
    case'lyrm':if(S.ly.draft.campos.length>1){S.ly.draft.campos.splice(+v,1);render(true);}break;
    case'lyrecalc':{let p=1;S.ly.draft.campos.forEach(c=>{c.pos=p;p+=Math.max(1,c.lon||1);});render(true);break;}
    case'lyvadd':S.ly.draft.variantes.push({ent:EMI[0].name,desc:''});render(true);break;
    case'lyvrm':S.ly.draft.variantes.splice(+v,1);render(true);break;
    case'lytoggle':S.ly.confirm=true;S.ly.err='';S.ly.motTmp='';render(true);{const m=document.getElementById('lymot');if(m)m.focus();}break;
    case'lytogno':S.ly.confirm=false;S.ly.err='';render(true);break;
    case'lytogok':{const l=LAYOUTS.find(x=>x.id===S.ly.sel);const m=((document.getElementById('lymot')||{}).value||'').trim();S.ly.motTmp=m;
      if(!l||!ROLES[S.role].lay)break;
      if(m.length<10){S.ly.err='Describe el motivo (mínimo 10 caracteres).';render(true);break;}
      l.activo=!l.activo;l.version++;l.hist.push({dt:Date.now(),usr:'Usuario demo',rol:S.role,acc:l.activo?'Activación':'Desactivación',ver:l.version,mot:m,cam:[['Estado',l.activo?'Inactivo':'Activo',l.activo?'Activo':'Inactivo']]});
      saveLy();log(l.activo?'Activación de layout':'Desactivación de layout',l.id+' v'+l.version);S.ly.confirm=false;S.ly.err='';S.ly.motTmp='';toast('Layout '+l.id+(l.activo?' activado.':' desactivado.'));render(true);break;}
    case'grupo':S.al.grupo=S.al.grupo===v?'':v;S.al.page=0;render(true);break;
    case'alsel':S.al.sel=v;render(true);{const d=document.getElementById('aldet');if(d)d.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});}break;
    case'alpage':S.al.page=+v;render(true);break;
    case'alset':{const x=ALERTS.find(y=>y.id===S.al.sel);if(x&&ROLES[S.role].act){const prev=x.estado;x.estado=v;persistAlerts();log('Cambio de estado de alerta',x.id+': '+prev+' → '+v);toast('Alerta '+x.id+': '+v.toLowerCase()+'.');render(true);}break;}
    case'nmtab':S.nm.tab=v;S.nm.page=0;render(true);break;
    case'nmpage':S.nm.page=+v;render(true);break;
    case'fichaXlsx':fichaXlsx();break;case'fichaPdf':fichaPdf();break;
    case'nmXlsx':nmXlsx();break;case'nmPdf':nmPdf();break;
    case'expAl':expAl();break;case'expRes':expRes();break;case'expResCsv':expResCsv();break;case'expDrill':expDrill();break;case'expSm':expSm();break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.dp){if(S.dp)S.dp[el.dataset.dp]=el.value;render(true);return;}
  if(el.dataset.rep){S.rep=+el.value;render(true);return;}
  if(el.dataset.f){const k=el.dataset.f;S.f[k]=el.value;if(k==='period'&&el.value==='custom'&&!S.f.from){S.f.from='2026-09-01';S.f.to='2026-09-24';}S.nm.page=0;render(true);}
  else if(el.dataset.al){S.al[el.dataset.al]=el.value;S.al.page=0;render(true);}
  else if(el.dataset.actChange==='slaDay'){S.slaDay=+el.value;render(true);}
  else if(el.name==='rol'){S.pendingRole=el.value;}
  else if(el.dataset.dyn){S.dyn[el.dataset.dyn]=el.value;S.page=0;render(true);}
  else if(el.dataset.sm){S.sm[el.dataset.sm]=el.value;render(true);}
  else if(el.dataset.lyf){S.ly[el.dataset.lyf]=el.value;render(true);}
  else if(S.view==='layouts'&&S.ly.edit)lyInput(el);
});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.mp&&S.mp){S.mp[el.dataset.mp]=el.value;const err=mpErr(S.mp);const er=document.getElementById('mp-err');if(er){er.textContent=err;er.hidden=!err;}
    const a=mpNum(S.mp.min),b=mpNum(S.mp.max);const sm=document.getElementById('mp-sum');if(sm)sm.textContent=err?'Revisa el rango':(a==null&&b==null?'Sin filtro de monto':(a!=null&&b!=null?mpFmt(a)+' a '+mpFmt(b):a!=null?'Desde '+mpFmt(a):'Hasta '+mpFmt(b)));
    const h=document.querySelector('.mp-h');if(h&&!err)h.outerHTML=mpHist(S.mp);return;}
  const fm=el.form&&el.form.getAttribute('id');const tk=fm==='sform'?'q':fm==='mform'?'mq':null;
  if(tk&&el.name&&S[tk].hasOwnProperty(fk(el.name))){S[tk][fk(el.name)]=el.type==='checkbox'?el.checked:el.value;if(el.type!=='checkbox')el.classList.toggle('on',!!el.value);return;}
  if(el.dataset.lyq){S.ly.q=el.value;const pos=el.selectionStart;render(true);const n=document.querySelector('[data-lyq]');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(err){}}return;}
  if(S.view==='layouts'&&S.ly.edit)lyInput(el);});
document.addEventListener('submit',e=>{
  e.preventDefault();const id=e.target.getAttribute('id');
  if(id==='lform'){const r=(new FormData(e.target)).get('rol')||S.pendingRole;S.role=r;S.pendingRole=r;try{localStorage.setItem('monitor-pos-atm-rol',r);}catch(err){}S.view='ejecutivo';log('Inicio de sesión','Rol '+r+' vía PingOne (demostración)');render();}
  else if(id==='sform'||id==='mform'){if(S.mp&&!mpApply()){return;}const tk=id==='sform'?'q':'mq';const q=S[tk];q.nm=false;new FormData(e.target).forEach((val,k)=>{k=fk(k);if(k==='nm')q.nm=true;else if(q.hasOwnProperty(k))q[k]=val;});S.dp=null;runSearch(tk);render(true);}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.mp){e.preventDefault();if(mpApply())render(true);return;}if(e.key==='Escape'&&(S.dp||S.help||S.mp)){S.dp=null;S.mp=null;S.help=false;render(true);}});
render();
})();
</script>
</body>
</html>
